<div id="tlBidirectionalBlock" style="display: none;">
    <p class="text-muted" style="font-size: 0.85rem;">Turn Enable on for each light you will use. Off skips that light.</p>
    <p class="direction-subsection-title"><i class="bi bi-arrow-right-circle"></i> ENTRY A</p>
    <div class="tl-config-grid">
        <div class="device-config-card">
            <div class="device-header">
                <span class="device-name">ENTRY A - Entry Traffic Light</span>
                <span class="device-status" id="directionA_entryTLStatus"></span>
            </div>
            <div class="device-fields">
                <div class="io-device-enable">
                    <label class="toggle-label">
                        <input type="checkbox" class="io-enable-input" id="directionA_entryTLEnabled" data-kind="tl" data-location="entry" data-direction="entry_a" onchange="onTrafficLightEnableToggle(this, true)">
                        <span>Enable</span>
                    </label>
                    <small class="text-muted">Off skips this light.</small>
                </div>
                <div class="row">
                    <div class="col-md-6"><div class="form-group"><label>Make / Brand</label><input type="text" class="form-control" id="directionA_entryTLMake"></div></div>
                    <div class="col-md-6"><div class="form-group"><label>Model Number</label><input type="text" class="form-control" id="directionA_entryTLModel"></div></div>
                </div>
                <div class="row">
                    <div class="col-md-6"><div class="form-group"><label>Red Pin</label><input type="number" class="form-control io-pin-input io-pin-input-output" id="directionA_entryRedPin" value="0" min="0"></div></div>
                    <div class="col-md-6"><div class="form-group"><label>Green Pin</label><input type="number" class="form-control io-pin-input io-pin-input-output" id="directionA_entryGreenPin" value="1" min="0"></div></div>
                </div>
            </div>
            <div class="btn-group-actions" style="margin-top: 12px;">
                <button class="btn btn-sm btn-error" onclick="testTrafficLightColor('entry_a', 'entry', 'red')"><i class="bi bi-circle-fill"></i> Test Red</button>
                <button class="btn btn-sm btn-success" onclick="testTrafficLightColor('entry_a', 'entry', 'green')"><i class="bi bi-circle-fill"></i> Test Green</button>
            </div>
        </div>
        <div class="device-config-card">
            <div class="device-header">
                <span class="device-name">ENTRY A - Exit Traffic Light</span>
                <span class="device-status" id="directionA_exitTLStatus"></span>

                </div>

                    <div class="col-md-6"><div class="form-group"><label>Green Pin</label><input type="number" class="form-control io-pin-input io-pin-input-output" id="directionA_exitGreenPin" value="3" min="0"></div></div>
                </div>
            </div>
            <div class="btn-group-actions" style="margin-top: 12px;">

                <button class="btn btn-sm btn-success" onclick="testTrafficLightColor('entry_a', 'exit', 'green')"><i class="bi bi-circle-fill"></i> Test Green</button>
            </div>
